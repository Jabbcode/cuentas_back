name: Release

# Publica una versión de CÓDIGO (bump de package.json + CHANGELOG + tag vX.Y.Z +
# GitHub Release + PR de sync a develop). NO despliega nada: publicar != desplegar.
# Se dispara al mergear un PR develop -> main (o hotfix/* -> main) que lleve una
# label release-type/patch | release-type/minor | release-type/major.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# release.yml y db-release.yml pueden dispararse en el mismo merge y ambos
# comitean/pushean a main: se serializan por este grupo compartido.
concurrency:
  group: publish-to-main
  cancel-in-progress: false

env:
  # Rutas cuyo cambio cuenta como "cambio de código" versionable en ESTE repo.
  # Si el PR no toca ninguna, no se genera versión (evita versionar CI/docs puros
  # bajo .github/ o .claude/).
  CODE_PATHS_REGEX: '^(src/|prisma/|package\.json$|package-lock\.json$|tsconfig\.json$|render\.yaml$)'

jobs:
  release:
    # Labels reconocidas (deben ir literales aquí; el contexto env no está
    # disponible en el if de job):
    #   release-type/patch | release-type/minor | release-type/major
    if: >
      github.event.pull_request.merged == true &&
      (
        github.event.pull_request.head.ref == 'develop' ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/')
      ) &&
      (
        contains(github.event.pull_request.labels.*.name, 'release-type/patch') ||
        contains(github.event.pull_request.labels.*.name, 'release-type/minor') ||
        contains(github.event.pull_request.labels.*.name, 'release-type/major')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comprobar si hay cambios de código
        id: codecheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.files[].filename')
          if echo "$files" | grep -qE "$CODE_PATHS_REGEX"; then
            echo "has_code_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Avisar que no hubo cambios de código
        if: steps.codecheck.outputs.has_code_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --body "⚠️ Este PR no toca \`src/\`, \`prisma/\` ni configs de build/runtime (\`package.json\`, \`package-lock.json\`, \`tsconfig.json\`, \`render.yaml\`) — no se generó ninguna versión ni release."

      - name: Determinar tipo de bump
        id: bump
        if: steps.codecheck.outputs.has_code_changes == 'true'
        env:
          # Nombres de label = datos del evento -> por env, nunca interpolado
          # dentro de `run:` (un nombre de label podría inyectar shell) (SEC-4).
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q 'release-type/major'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q 'release-type/minor'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Calcular nueva versión
        id: version
        if: steps.codecheck.outputs.has_code_changes == 'true'
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          current=$(node -p "require('./package.json').version")
          IFS='.' read -r major minor patch <<< "$current"
          case "$BUMP_TYPE" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "new=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "previous=$current" >> "$GITHUB_OUTPUT"

      - name: Bump package.json
        if: steps.codecheck.outputs.has_code_changes == 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.env.NEW_VERSION;fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')"

      - name: Generar changelog del rango
        id: notes
        if: steps.codecheck.outputs.has_code_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV_VERSION: ${{ steps.version.outputs.previous }}
        run: |
          prev_tag="v${PREV_VERSION}"
          if git rev-parse "$prev_tag" >/dev/null 2>&1; then
            from_ref="$prev_tag"
          else
            # Primer release del repo: rango desde el commit raíz.
            from_ref=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          bash .github/scripts/build-changelog.sh "$from_ref" HEAD > /tmp/notes.md || true
          if [ ! -s /tmp/notes.md ]; then
            echo "_Sin cambios categorizados en el rango._" > /tmp/notes.md
          fi

      - name: Actualizar CHANGELOG.md
        if: steps.codecheck.outputs.has_code_changes == 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
          PREV_VERSION: ${{ steps.version.outputs.previous }}
        run: |
          date=$(date +%Y-%m-%d)
          range="v${PREV_VERSION}...v${NEW_VERSION}"
          compare_url="https://github.com/${{ github.repository }}/compare/${range}"

          {
            head -n 6 CHANGELOG.md
            echo ""
            echo "## [${NEW_VERSION}] - $date"
            echo ""
            cat /tmp/notes.md
            echo ""
            tail -n +7 CHANGELOG.md
          } > /tmp/changelog-new.md
          mv /tmp/changelog-new.md CHANGELOG.md

          # Acumula el link de comparación completa al final, más reciente arriba.
          bullet="- [$range]($compare_url)"
          if grep -q "^## Comparaciones completas$" CHANGELOG.md; then
            awk -v bullet="$bullet" '
              {
                print
                if ($0 ~ /^## Comparaciones completas$/ && !done) {
                  getline nextline
                  print nextline
                  print bullet
                  done = 1
                }
              }
            ' CHANGELOG.md > /tmp/changelog-with-link.md
            mv /tmp/changelog-with-link.md CHANGELOG.md
          else
            {
              cat CHANGELOG.md
              echo ""
              echo "---"
              echo ""
              echo "## Comparaciones completas"
              echo ""
              echo "$bullet"
            } > /tmp/changelog-with-link.md
            mv /tmp/changelog-with-link.md CHANGELOG.md
          fi

      - name: Commit del version bump
        if: steps.codecheck.outputs.has_code_changes == 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore: release v${NEW_VERSION}"
          git pull --rebase origin main
          git push origin main

      - name: Crear y pushear el tag
        if: steps.codecheck.outputs.has_code_changes == 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          git tag "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

      - name: Crear GitHub Release
        if: steps.codecheck.outputs.has_code_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes-file /tmp/notes.md

      - name: Crear PR de sync a develop
        if: steps.codecheck.outputs.has_code_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          existing=$(gh pr list --base develop --head main --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "Ya hay un PR de sync main -> develop abierto; nada que crear."
            exit 0
          fi
          if ! gh pr create \
            --base develop \
            --head main \
            --title "chore: sync develop con main v${NEW_VERSION}" \
            --body "Sincroniza \`develop\` con el CHANGELOG y version bump de v${NEW_VERSION} publicados en \`main\`."; then
            gh pr comment "$PR_NUMBER" \
              --body "⚠️ Release v${NEW_VERSION} publicada (tag + GitHub Release), pero no se pudo abrir el PR de sync \`main → develop\` automáticamente. Créalo a mano."
          fi
